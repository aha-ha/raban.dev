<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <script src="lib/jquery-3.3.1.min.js"></script>
    <script src="lib/jquery.terminal.min.js"></script>
    <link rel="stylesheet" href="lib/jquery.terminal.min.css"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        #terminal {
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <script>
        let term;
        let loadingInterval;
        let dotCount = 0;

        $('#terminal').terminal(
            function(input, terminal) {
                const answer = input.trim().toLowerCase();
                
                if (answer === 'y' || answer === 'yes' || answer === '') {
                    terminal.echo('Redirecting to homepage...');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 500);
                } else if (answer === 'n' || answer === 'no') {
                    terminal.echo('doing nothing');
                } else {
                    terminal.echo('error');
                }
            },
            {
                greetings: false,
                prompt: '',
                enabled: false
            }
        );

        term = $('#terminal').terminal();

        // Loading animation
        term.echo('Loading');
        loadingInterval = setInterval(() => {
            dotCount = (dotCount + 1) % 4;
            const dots = '.'.repeat(dotCount);
            term.update(-1, 'Loading' + dots);
        }, 200);

        // After 800ms, show the 404 message
        setTimeout(() => {
            clearInterval(loadingInterval);
            term.clear();
            term.echo('404 - Page not found');
            term.echo('');
            term.echo('Would you like to return to the homepage? Y/n');
            term.set_prompt('[user@raban.dev /404.html]$ ');
            term.enable();
        }, 800);
    </script>
</body>
</html>
